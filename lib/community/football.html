<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Retro Pixel Football</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; background-color: #222; color: white; font-family: sans-serif; }
        canvas { background-color: #4CAF50; border: 4px solid #fff; box-shadow: 0 0 10px #000; }
        .scoreboard { display: flex; width: 800px; justify-content: space-between; font-size: 24px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="scoreboard">
        <div style="color: white;">Real Madrid (Bellingham): <span id="score1">0</span></div>
        <div style="color: lightblue;">Man City (Haaland): <span id="score2">0</span></div>
    </div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Game Objects
    let p1 = { x: 200, y: 180, size: 20, color: 'white', speed: 4, dx: 0, dy: 0 };
    let p2 = { x: 580, y: 180, size: 20, color: 'lightblue', speed: 4, dx: 0, dy: 0 };
    let ball = { x: 400, y: 200, size: 8, color: 'yellow', dx: 0, dy: 0, friction: 0.98 };
    let score = { p1: 0, p2: 0 };

    // Controls
    const keys = {};
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    function update() {
        // P1 Movement (WASD)
        if (keys['w']) p1.y -= p1.speed;
        if (keys['s']) p1.y += p1.speed;
        if (keys['a']) p1.x -= p1.speed;
        if (keys['d']) p1.x += p1.speed;

        // P2 Movement (Arrow Keys)
        if (keys['ArrowUp']) p2.y -= p2.speed;
        if (keys['ArrowDown']) p2.y += p2.speed;
        if (keys['ArrowLeft']) p2.x -= p2.speed;
        if (keys['ArrowRight']) p2.x += p2.speed;

        // Ball Physics & Collision (Basic)
        ball.x += ball.dx;
        ball.y += ball.dy;
        ball.dx *= ball.friction;
        ball.dy *= ball.friction;

        // Bounce off walls
        if (ball.y < 0 || ball.y > canvas.height) ball.dy *= -1;
        
        // Player to Ball Collision
        [p1, p2].forEach(p => {
            let dist = Math.hypot(ball.x - p.x, ball.y - p.y);
            if (dist < p.size + ball.size) {
                ball.dx = (ball.x - p.x) * 0.2;
                ball.dy = (ball.y - p.y) * 0.2;
            }
        });

        // Scoring (Left and Right edges)
        if (ball.x < 0) { score.p2++; reset(); }
        if (ball.x > canvas.width) { score.p1++; reset(); }
    }

    function reset() {
        ball.x = 400; ball.y = 200; ball.dx = 0; ball.dy = 0;
        p1.x = 200; p1.y = 180; p2.x = 580; p2.y = 180;
        document.getElementById('score1').innerText = score.p1;
        document.getElementById('score2').innerText = score.p2;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Pitch markings
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath(); ctx.moveTo(400, 0); ctx.lineTo(400, 400); ctx.stroke();
        ctx.beginPath(); ctx.arc(400, 200, 50, 0, Math.PI * 2); ctx.stroke();

        // Draw entities
        ctx.fillStyle = p1.color; ctx.fillRect(p1.x, p1.y, p1.size, p1.size);
        ctx.fillStyle = p2.color; ctx.fillRect(p2.x, p2.y, p2.size, p2.size);
        ctx.fillStyle = ball.color; 
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.size, 0, Math.PI * 2); ctx.fill();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
